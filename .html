<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사 II 학습실</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f3f5fa;color:#20283a;line-height:1.65}
header{background:#263f79;color:white;padding:25px 18px}
header,main{padding-left:max(18px,calc((100% - 1000px)/2));padding-right:max(18px,calc((100% - 1000px)/2))}
nav{display:flex;gap:6px;overflow-x:auto;background:white;padding:10px;position:sticky;top:0;border-bottom:1px solid #ddd;z-index:2}

button{cursor:pointer;background:white}
nav button.active,.primary{background:#294f9b;color:white}
main{padding-top:20px;padding-bottom:40px}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toolbar input{flex:1;min-width:180px}
.event,.card,.question{background:white;border:1px solid #dce2eb;border-radius:12px;padding:15px;margin:12px 0}

.event h3{margin:4px 0}

th{background:#e9effb}

.flashcard{text-align:center;padding:25px 12px}
.flashcard .question-text{font-size:1.3rem;font-weight:bold;margin:20px 0}
.answer{background:#edf3ff;padding:12px;border-radius:8px;margin:12px 0}
.hidden{display:none}
.option{display:block;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:8px;cursor:pointer}
.correct{background:#e4f7eb;padding:10px;margin-top:8px}
.wrong{background:#fff0ee;padding:10px;margin-top:8px}
.muted{color:#667085;font-size:.9rem}
.statrow{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:white;padding:14px;border:1px solid #ddd;border-radius:10px}

</head>
<body>
<header>
<h1>한국사 II 학습실</h1>
<div>제1차 세계 대전부터 1948년 정부 수립과 제주 4·3 사건까지</div>
</header>

<nav>
<button class="active" data-tab="timeline">연표</button>
<button data-tab="summary">시대별 정리</button>
<button data-tab="cards">암기 카드</button>
<button data-tab="quiz">객관식 퀴즈</button>
<button data-tab="progress">학습 기록</button>
</nav>

<main>
<section id="timeline" class="panel active">
<h2>주요 사건 연표</h2>
<div class="toolbar">
<input id="search" placeholder="사건·인물·키워드 검색">
<select id="period">
<option value="all">전체 시대</option>
<option value="1919">1919~1925</option>
<option value="1926">1926~1936</option>
<option value="1937">1937~1945</option>
<option value="1945">1945~1948</option>
</select>
</div>
<div id="events"></div>
</section>

<section id="summary" class="panel">
<h2>시대별 핵심 정리표</h2>
<div id="tables"></div>
</section>

<section id="cards" class="panel">
<h2>암기 카드</h2>
<p class="muted">정답을 떠올린 다음 정답 공개를 눌러 확인해.</p>
<div class="flashcard card">
<div id="cardCount" class="muted"></div>
<div id="cardQuestion" class="question-text"></div>
<div id="cardAnswer" class="answer hidden"></div>
<div id="cardExplain" class="muted hidden"></div>
</div>
<div class="toolbar">
<button id="reveal">정답 공개</button>
<button id="remember">기억 완료 ✓</button>
<button id="prev">← 이전</button>
<button id="next" class="primary">다음 →</button>
<button id="shuffle">카드 섞기</button>
</div>
<div id="cardStatus" class="muted"></div>
</section>

<section id="quiz" class="panel">
<h2>객관식 퀴즈</h2>
<p class="muted">문제를 풀고 채점하면 정답과 해설이 표시돼.</p>
<div class="toolbar">
<select id="quizPeriod">
<option value="all">전체 범위</option>
<option value="1919">1919~1925</option>
<option value="1926">1926~1936</option>
<option value="1937">1937~1945</option>
<option value="1945">1945~1948</option>
</select>
<button id="newQuiz">문제 다시 섞기</button>
</div>
<div id="questions"></div>
<button class="primary" id="grade">채점하기</button>
<div id="result"></div>
</section>

<section id="progress" class="panel">
<h2>학습 기록</h2>
<div class="statrow">
<div class="stat">기억한 카드<strong id="rememberedCount">0</strong></div>
<div class="stat">최근 퀴즈 점수<strong id="lastScore">—</strong></div>
<div class="stat">퀴즈 완료<strong id="quizCount">0</strong></div>
</div>
<div class="card">
<p>기록은 현재 브라우저에 저장돼. 다른 기기와 자동으로 동기화되지는 않아.</p>
<button id="reset">학습 기록 초기화</button>
</div>
</section>
</main>

<script>

["1919","문화 통치 표방","1919","일제는 통치 방식의 변화를 내세웠지만 검열과 경찰 통제 등 식민 지배는 지속되었다.","일제,문화 통치"],
["1920.6","봉오동 전투","1919","홍범도 등이 이끈 독립군 부대가 일본군과 싸워 승리했다.","홍범도,만주,독립군"],
["1920.10","청산리 대첩","1919","김좌진과 북로군정서군 등 독립군 부대가 일본군과 여러 차례 전투를 벌였다.","김좌진,만주,독립군"],
["1920","간도 참변","1919","일본군이 독립군 토벌을 구실로 간도 지역 한인 사회를 공격했다.","간도,탄압"],
["1923","국민 대표 회의","1919","대한민국 임시 정부의 활동 방향을 둘러싸고 독립운동 세력 사이의 논쟁이 벌어졌다.","임시 정부,독립운동"],
["1920년대","실력 양성 운동","1919","교육과 산업을 발전시켜 민족의 실력을 기르려는 운동이다. 물산 장려 운동과 민립 대학 설립 운동 등이 관련된다.","물산 장려,민립 대학"],
["1926.6.10","6·10 만세 운동","1926","순종의 장례일을 계기로 학생과 사회운동 세력 등이 만세 시위를 벌였다.","학생 운동"],
["1927","신간회 창립","1926","민족주의 계열과 사회주의 계열 일부가 협력해 결성한 민족 협동 전선 단체다.","신간회,민족 협동 전선"],
["1927","근우회 창립","1926","여성의 단결과 지위 향상, 민족 해방을 위해 활동한 여성 단체다.","근우회,여성 운동"],
["1929.11","광주 학생 항일 운동","1926","광주에서 시작해 전국으로 확산된 학생 중심 항일 운동이다.","광주,학생 운동"],
["1931","만주 사변","1926","일본이 만주 침략과 점령을 확대했다.","만주,일본 침략"],
["1932.1","이봉창 의거","1926","이봉창이 도쿄에서 폭탄을 던졌으나 목표를 이루지는 못했다. 한인 애국단 활동의 일부다.","이봉창,김구,한인 애국단"],
["1932.4","윤봉길 의거","1926","윤봉길이 상하이 홍커우 공원 행사장에서 폭탄을 던졌다.","윤봉길,상하이,한인 애국단"],

["1937","중일 전쟁","1937","일본의 중국 침략 전쟁이 전면화되면서 식민지 조선의 인적·물적 동원이 강화되었다.","중일 전쟁,전시 체제"],

["1943.11","카이로 선언","1937","연합국 지도자들이 한국의 독립을 약속하는 내용을 선언에 담았다.","카이로 선언,연합국"],

["1945.9","38도선과 미·소 군정","1945","남쪽에는 미군, 북쪽에는 소련군이 진주해 군정을 실시했다.","38도선,미군정,소련군"],

["1948.4.3","제주 4·3 사건 시작","1945","남한 단독 선거 반대와 경찰·서북청년회 등의 탄압, 지역 갈등 등이 배경이 되었다. 무장 봉기와 진압 과정에서 많은 민간인이 희생되었다.","제주,분단,민간인 희생"],

["1948.5.10","남한 단독 총선거","1945","제헌 국회 구성을 위한 총선거가 남한에서 실시되었다. 제주 일부 지역에서는 선거가 정상적으로 치러지지 못했다.","5·10 총선거,제헌 국회"],
["1948.7.17","대한민국 헌법 공포","1945","제헌 국회가 제정한 대한민국 헌법이 공포되었다.","헌법,제헌 국회"],
["1948.8.15","대한민국 정부 수립","1945","대한민국 정부 수립이 선포되었다. 한반도 전체의 통일 정부가 수립된 것은 아니었다.","대한민국,이승만"],
["1948.9.9","조선민주주의인민공화국 수립","1945","북한에서 조선민주주의인민공화국 수립이 선포되었다. 대한민국 정부 수립일인 8월 15일과 구분해 기억한다.","북한,김일성,정부 수립"]
];

["1937","한국광복군이 창설된 해는?","1940년","중국 충칭에서 창설되었다."],

const questions=[

["1919","봉오동 전투와 관련된 인물은?",["김규식","양세봉","홍범도","여운형"],2,"홍범도는 봉오동 전투에서 독립군을 이끈 인물이다."],
["1919","3·1 운동 이후 일제가 표방한 통치 방식은?",["문화 통치","독립 승인","통일 정부","신탁 통치"],0,"문화 통치를 표방했지만 식민 지배는 지속되었다."],
["1919","1920년 독립군의 대표적인 승리 전투는?",["봉오동 전투와 청산리 대첩","한산도 대첩과 행주 대첩","살수 대첩과 귀주 대첩","황산벌 전투와 매소성 전투"],0,"봉오동 전투와 청산리 대첩은 1920년 독립군의 대표적 승리다."],

["1926","1929년 학생 항일 운동이 시작되어 전국으로 확산된 도시는?",["부산","평양","광주","대구"],2,"광주 학생 항일 운동은 1929년 11월 광주에서 시작되었다."],
["1926","이봉창·윤봉길 의거와 관련된 단체는?",["신간회","한인 애국단","근우회","조선어학회"],1,"한인 애국단은 김구가 이끈 독립운동 단체다."],
["1926","한국 독립군·조선 혁명군에 관한 설명으로 옳은 것은?",["국내 교육 운동만 전개","만주에서 일본군에 맞선 무장 투쟁","1948년에 창설","신탁 통치를 추진"],1,"두 부대는 만주에서 무장 투쟁을 전개했다."],
["1937","1937년에 시작된 일본의 전쟁은?",["러일 전쟁","중일 전쟁","청일 전쟁","한국 전쟁"],1,"중일 전쟁은 1937년에 전면화되었다."],
["1937","한국광복군이 창설된 해는?",["1919년","1927년","1932년","1940년"],3,"한국광복군은 1940년 중국 충칭에서 창설되었다."],
["1937","창씨개명에 대한 설명으로 옳은 것은?",["독립을 승인한 정책","일본식 성명을 강요한 정책","총선거를 위한 정책","임시 정부의 군사 정책"],1,"창씨개명은 황국 신민화 정책의 일부였다."],
["1937","조선어학회 사건에 대한 설명으로 옳은 것은?",["조선어 연구 인사들이 탄압받았다","대한민국 정부가 수립되었다","신간회가 창립되었다","유엔이 한국 문제를 논의했다"],0,"1942년 일제는 조선어학회 관련 인사들을 탄압했다."],
["1945","광복 이후 남북 군정 구분과 관련된 선은?",["휴전선","38도선","위도 17도선","그리니치 자오선"],1,"38도선을 기준으로 남쪽에는 미군, 북쪽에는 소련군이 진주했다."],
["1945","모스크바 3국 외상 회의에 참여한 국가는?",["미국·영국·소련","미국·중국·일본","영국·프랑스·독일","중국·소련·일본"],0,"미국·영국·소련 외상이 한국 문제를 논의했다."],
["1945","좌우 합작 운동과 관련된 인물 조합은?",["홍범도·김좌진","여운형·김규식","이봉창·윤봉길","지청천·양세봉"],1,"여운형과 김규식은 통일 정부 수립을 모색했다."],
["1945","남한에서 제헌 국회 구성을 위한 총선거가 실시된 날은?",["1945년 8월 15일","1947년 3월 1일","1948년 5월 10일","1948년 9월 9일"],2,"5·10 총선거는 1948년 5월 10일 실시되었다."],
["1945","대한민국 정부와 조선민주주의인민공화국의 수립 날짜를 바르게 연결한 것은?",["대한민국 8월 15일 / 조선민주주의인민공화국 9월 9일","대한민국 9월 9일 / 조선민주주의인민공화국 8월 15일","둘 다 8월 15일","둘 다 9월 9일"],0,"대한민국 정부는 1948년 8월 15일, 조선민주주의인민공화국은 9월 9일 수립되었다."],
["1945","제주 4·3 사건의 배경과 관련된 사건은?",["봉오동 전투","제주 3·1절 발포 사건","2·8 독립 선언","청산리 대첩"],1,"1947년 제주 3·1절 발포 사건 이후 갈등이 심화되었다."],
["1945","제주 4·3 사건이 시작된 날짜는?",["1945년 8월 15일","1947년 3월 1일","1948년 4월 3일","1948년 8월 15일"],2,"제주 4·3 사건은 1948년 4월 3일 시작되었다."]
];

const $=id=>document.getElementById(id);
const key="koreanHistoryStudy";
let progress={remembered:[],lastScore:null,quizCount:0};
try{progress={...progress,...JSON.parse(localStorage.getItem(key)||"{}")}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(progress))}catch(e){}updateProgress()}
function updateProgress(){
$("rememberedCount").textContent=progress.remembered.length;
$("lastScore").textContent=progress.lastScore===null?"—":progress.lastScore+"%";
$("quizCount").textContent=progress.quizCount;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
b.classList.add("active");$(b.dataset.tab).classList.add("active");
});
function renderEvents(){
let q=$("search").value.toLowerCase().trim(),p=$("period").value;
let list=events.filter(e=>(p==="all"||e[2]===p)&&e.join(" ").toLowerCase().includes(q));
$("events").innerHTML=list.map(e=>`<article class="event"><div class="date">${e[0]}</div><h3>${e[1]}</h3><p>${e[3]}</p>${e[4].split(",").map(t=>`<span class="tag">${t}</span>`).join("")}</article>`).join("")||"<p>검색 결과가 없어.</p>";
}
$("search").oninput=renderEvents;$("period").onchange=renderEvents;
$("tables").innerHTML=summaries.map(s=>`<div class="card"><h3>${s[0]}</h3><div class="table-wrap"><table><tbody>${s[1].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</tbody></table></div></div>`).join("");

let cardOrder=[...cards],ci=0;
function drawCard(){
let c=cardOrder[ci];
$("cardCount").textContent=`${ci+1} / ${cardOrder.length}`;
$("cardQuestion").textContent=c[1];$("cardAnswer").textContent=c[2];$("cardExplain").textContent=c[3];
$("cardAnswer").classList.add("hidden");$("cardExplain").classList.add("hidden");
$("cardStatus").textContent=progress.remembered.includes(c[1])?"✓ 기억 완료로 표시됨":"";
}
$("reveal").onclick=()=>{$("cardAnswer").classList.remove("hidden");$("cardExplain").classList.remove("hidden")};
$("remember").onclick=()=>{let q=cardOrder[ci][1];if(!progress.remembered.includes(q))progress.remembered.push(q);save();drawCard();$("cardAnswer").classList.remove("hidden");$("cardExplain").classList.remove("hidden")};
$("next").onclick=()=>{ci=(ci+1)%cardOrder.length;drawCard()};
$("prev").onclick=()=>{ci=(ci-1+cardOrder.length)%cardOrder.length;drawCard()};
$("shuffle").onclick=()=>{cardOrder.sort(()=>Math.random()-.5);ci=0;drawCard()};

let quiz=[];
function buildQuiz(){
let p=$("quizPeriod").value;
quiz=questions.filter(q=>p==="all"||q[0]===p).sort(()=>Math.random()-.5);
$("questions").innerHTML=quiz.map((q,i)=>`<article class="question"><h3>${i+1}. ${q[1]}</h3>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}<div id="fb${i}" class="hidden"></div></article>`).join("");
$("result").innerHTML="";
}
$("newQuiz").onclick=buildQuiz;$("quizPeriod").onchange=buildQuiz;
$("grade").onclick=()=>{
let score=0,answered=0;
quiz.forEach((q,i)=>{
let chosen=document.querySelector(`input[name="q${i}"]:checked`),fb=$("fb"+i);
fb.classList.remove("hidden","correct","wrong");
if(chosen)answered++;
if(chosen&&Number(chosen.value)===q[3]){score++;fb.classList.add("correct");fb.innerHTML="정답! "+q[4]}
else{fb.classList.add("wrong");fb.innerHTML=`${chosen?"오답":"미응답"} · 정답: ${q[2][q[3]]}<br>${q[4]}`}
});
let pct=Math.round(score/quiz.length*100);
progress.lastScore=pct;progress.quizCount++;save();
$("result").innerHTML=`<div class="card"><h3>점수: ${score}/${quiz.length} (${pct}%)</h3><p>응답한 문항: ${answered}/${quiz.length}</p><p>오답 해설을 읽고 암기 카드에서 다시 복습해 봐.</p></div>`;
};
$("reset").onclick=()=>{if(confirm("학습 기록을 초기화할까?")){progress={remembered:[],lastScore:null,quizCount:0};save();drawCard()}};

renderEvents();drawCard();buildQuiz();updateProgress();
</script>
</body>
</html>
